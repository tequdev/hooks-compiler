[package]
name = "xahau-hook-wasm"
version = "0.1.0"
edition = "2021"
description = "Xahau Hook WebAssembly post-processing stage, compiled to wasm32-unknown-unknown"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasmparser = "0.254"
wasm-encoder = { version = "0.254", features = ["wasmparser"] }
wasmprinter = "0.254"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true

[dev-dependencies]
wat = "1.254"
