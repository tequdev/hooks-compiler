name: Determinism
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:determinism
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: wasm-${{ matrix.os }}
          path: determinism-out
